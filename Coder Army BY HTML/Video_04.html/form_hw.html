<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form_Project2</title>
</head>

<body>
    <h1>Job Application: Senior Web Developer</h1>
    <p>Thank you for your interest in joining our team. Please fill out the application below.</p>


    <hr>

    <form action="">
        <h2>Personal Information</h2>
        <label for="Name">Full Name:</label>
        <br>
        <input type="text" name="UserName" id="Name">
        <br>
        <br>

        <label for="email">Email:</label>
        <br>
        <input type="email" name="email" id="email">
        <br>
        <br>

        <label for="Number">Phone:</label>
        <br>
        <input type="tel" name="PhoneNumber" id="Number">
        <br>
        <br>

        <label for="URL">LinkedIn Profile URL:</label>
        <br>
        <input type="text" name="Profile URL" id="URL" placeholder="  https://linkedin.com/in/yo ">
        <br>
        <br>


        <hr>

        <h2>professional experience</h2>
        <label for="">Upload Your Resume (PDF or DOCX):</label>
        <br>
        <input type="file">
        <br><br>

        <Label for="Letter">Cover Letter:</Label>
        <br>
        <textarea name="Cover Letter" id="Letter" rows="10" cols="25"
            placeholder="Tell us why you're a great fit for this role..."></textarea>
        <br><br>

        <label for="professional Experience">Years of professional Experience:</label>
        <br>
        <input type="text" id="professional Experience">
        <br><br>

        <label for="Start Date">Earliest Possible Start Date:</label>
        <br>
        <input type="date" name="Possible Start Date" id="Start Date">
        <br><br>

        <hr>

        <h2>Skills & Availability</h2>
        <label for="">Primary Skillset (Choose One):</label>
        <br>
        <input type="radio" name="Position" id="Developer" value="Frontend Developer">
        <label for="Developer">Frontend Developer</label>
        <br>
        <input type="radio" name="Position" id="Backend Developer" value="Backend Developer">
        <label for="Backend Developer">Backend Developer</label>
        <br>
        <input type="radio" name="Position" id="Full-stack Developer" value="Full-stack Developer">
        <label for="Full-stack Developer">Full-stack Developer</label>
        <br><br>

        <label for="">Additional Skills (Select all That apply):</label>
        <br>
        <input type="checkbox" name="Additional Skills" id="Skills" value="Additional Skills">
        <label for="Skills">React</label>
        <br>
        <input type="checkbox" name="Technology" id="Node.js" value="Technology">
        <label for="Node.js">Node.js</label>
        <br>
        <input type="checkbox" name="Database Manageement" id="Manageement" value="Database Manageement">
        <label for="Manageement">Database Manageement</label>
        <br>
        <input type="checkbox" name="Cloud/DevOps" id="Key Component" value="Cloud/DevOps">
        <label for="Key Component">Cloud/DevOps</label>
        <br>
        <br>

        <section>
            <label for="job">Preferred Work Type:</label>
            <br>
            <select name="parfect-time" id="job">
                <option value="time">Full-Time</option>
                <option value="time">Part-time</option>
            </select>
        </section>
        <br>
        
        <hr>
        <h2>Final Confirmation</h2>
        <input type="checkbox" name="Confirmation" id="Final Confirmation">
        <label for="Final Confirmation">I am legally authorized to work in this country.</label>
        <br>
        <br>
        <label for="">How did you hear about us?</label>
        <br>
        <input type="text" name="" id="" placeholder="   e.g., Linkedin, company">
        <br><br>


        <button type="submit">Submit Application</button>
        <button type="reset">Clear Form</button>

        <br><br><br><br>
    </form>
</body>

</html>
