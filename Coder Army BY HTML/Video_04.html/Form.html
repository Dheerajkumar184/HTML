<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Forms Form Beginner to Advance | HTML Full Course #04</title>
</head>

<body>
    <form action="">
        <label for="Name">Name:</label>
        <input type="text" name="UserName" id="Name">
        <br><br>

        <label for="Fathername">Father Name:</label>
        <input type="text" name="Userfathername" id="Fathername">
        <br><br>

        <label for="Age">Age:</label>
        <input type="number" name="userage" id="Age">
        <br><br>

        <label for="Password">Password:</label>
        <input type="password" name="usepassword" id="Password">
        <br><br>

        <label for="male">Male</label>
        <input type="radio" name="Gender" id="male" value="male">


        <label for="female">female</label>
        <input type="radio" name="Gender" id="female" value="female">


        <label for="Other">Other</label>
        <input type="radio" name="Gender" id="Other" value="Other">
        <br><br>

        <label for="C++">C++</label>
        <input type="checkbox" name="Subject" id="C++" value="C++">

        <label for="Java">Java</label>
        <input type="checkbox" name="Subject" id="Java" value="Java">

        <label for="Python">Python</label>
        <input type="checkbox" name="Subject" id="Python" value="Python">

        <label for="JavaScript">JavaScript</label>
        <input type="checkbox" name="Subject" id="JavaScript" value="JavaScript">
        5
        <br><br>
        <input type="submit">
    </form>
</body>

</html>
